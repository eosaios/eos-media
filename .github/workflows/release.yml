name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, e.g. 0.1.0-dev.1 or 0.1.0-beta.4"
        required: true
      channel:
        description: "Must match the version suffix"
        type: choice
        options: [dev, beta, stable]
        default: dev
        required: true
      publish:
        description: "Publish a new release after validation (false builds Actions artifacts only)"
        type: boolean
        default: false
        required: true
      platforms:
        description: "Build macOS only or all platforms"
        type: choice
        options: [macos, all]
        default: all
        required: true
      src_ref:
        description: "Reviewed source ref (resolved to one commit before building)"
        default: main
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: media-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: eosaios/mediakit
          ref: ${{ inputs.src_ref || 'main' }}
          token: ${{ secrets.EOS_SOURCE_PAT }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate channel/version and pin source
        id: meta
        working-directory: src
        env:
          REQUEST_VERSION: ${{ inputs.version || github.ref_name }}
          REQUEST_CHANNEL: ${{ inputs.channel }}
          REQUEST_PLATFORMS: ${{ inputs.platforms || 'all' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only pass user inputs as data, never interpolate them into shell source.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { identity } from './scripts/release.mjs';
          const info = identity(process.env.REQUEST_VERSION.replace(/^v/, ''), process.env.REQUEST_CHANNEL || undefined);
          const platforms = [{ os: 'windows-latest', platform: 'windows' }, { os: 'macos-latest', platform: 'macos' }, { os: 'ubuntu-latest', platform: 'linux' }];
          const selected = process.env.REQUEST_PLATFORMS === 'macos' ? platforms.filter(p => p.platform === 'macos') : platforms;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include:selected})}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${info.version}\nchannel=${info.channel}\n`);
          JS
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tag="v${REQUEST_VERSION#v}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists: $tag. Choose a new version; existing assets are immutable."
            exit 1
          fi

  build:
    needs: resolve
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      CHANNEL: ${{ needs.resolve.outputs.channel }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src/target/channels/${{ needs.resolve.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: eosaios/mediakit
          ref: ${{ needs.resolve.outputs.source_commit }}
          token: ${{ secrets.EOS_SOURCE_PAT }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Prepare coherent release metadata
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          node scripts/release.mjs prepare --version "$VERSION" --channel "$CHANNEL"
          node --test scripts/release.test.mjs
      - name: Resolve pinned shared core
        id: core
        shell: bash
        working-directory: src
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const core = JSON.parse(fs.readFileSync('release-core.json'));
          if (core.repository !== 'eosaios/eos-core-rs' || !/^[a-f0-9]{40}$/.test(core.commit)) throw new Error('Invalid shared core pin');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${core.commit}\n`);
          JS
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-core-rs
          ref: ${{ steps.core.outputs.commit }}
          token: ${{ secrets.EOS_SOURCE_PAT }}
          path: eos-core-rs
          persist-credentials: false
      - name: Install Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target/channels/${{ needs.resolve.outputs.channel }}
      - name: Build Windows installers and CLI
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: src
        run: ./build.ps1 -Version $env:VERSION -Channel $env:CHANNEL
      - name: Build macOS universal
        if: matrix.platform == 'macos'
        working-directory: src
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run test:release
          npm test
          xcodebuild -version
          npm run tauri -- build --target universal-apple-darwin --bundles app
          APP_NAME="$(node -p 'require("./src-tauri/tauri.conf.json").productName')"
          APP="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/macos/$APP_NAME.app"
          test -s "$APP/Contents/Resources/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist")" = Media
          codesign --force --sign - --options runtime "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p "$CARGO_TARGET_DIR/dmg-stage"
          ditto "$APP" "$CARGO_TARGET_DIR/dmg-stage/$APP_NAME.app"
          ln -s /Applications "$CARGO_TARGET_DIR/dmg-stage/Applications"
          hdiutil create -quiet -volname "$APP_NAME" -srcfolder "$CARGO_TARGET_DIR/dmg-stage" -format UDZO "$CARGO_TARGET_DIR/$APP_NAME"_"$VERSION"_universal.dmg
          hdiutil verify "$CARGO_TARGET_DIR/$APP_NAME"_"$VERSION"_universal.dmg
          cargo build --locked --release -p eos-media-cli --target aarch64-apple-darwin
          cargo build --locked --release -p eos-media-cli --target x86_64-apple-darwin
          lipo -create -output "$CARGO_TARGET_DIR/eos-media-cli-universal" \
            "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/eos-media-cli" \
            "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/eos-media-cli"
          test "$("$CARGO_TARGET_DIR/eos-media-cli-universal" --version)" = "EOS Media v$VERSION"
      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: src
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run tauri -- build --bundles deb,appimage
          cargo build --locked --release -p eos-media-cli
          test "$("$CARGO_TARGET_DIR/release/eos-media-cli" --version)" = "EOS Media v$VERSION"
      - name: Stage Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "src/output/$CHANNEL/$VERSION/eos-media-setup-$VERSION.exe" dist/
          cp "src/target/channels/$CHANNEL/release/eos-media-cli.exe" "dist/eos-media-cli-$VERSION-windows-x64.exe"
      - name: Stage macOS
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/"*"_${VERSION}_universal.dmg" dist/
          cp src/src-tauri/icons/native/manifest.json dist/native-icon-manifest-macos.json
          tar -czf "dist/eos-media-cli-$VERSION-macos-universal.tar.gz" -C "$CARGO_TARGET_DIR" eos-media-cli-universal
      - name: Stage Linux
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/bundle/deb/"*.deb dist/
          cp "$CARGO_TARGET_DIR/release/bundle/appimage/"*.AppImage dist/
          tar -czf "dist/eos-media-cli-$VERSION-linux-x64.tar.gz" -C "$CARGO_TARGET_DIR/release" eos-media-cli
      - name: Record build identity
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cd src
          node scripts/release.mjs check
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { check } from './scripts/release.mjs';
          const info = { ...check(process.cwd()), sourceCommit: process.env.SOURCE_COMMIT, sharedCore: JSON.parse(fs.readFileSync('release-core.json')), platform: process.env.PLATFORM };
          fs.writeFileSync(`../dist/release-manifest-${info.platform}.json`, JSON.stringify(info, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    needs: [resolve, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish once with correct channel classification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: bash scripts/publish.sh
